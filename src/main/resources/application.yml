micronaut:
  application:
    name: urlShortener

datasources:
    default:
        url: jdbc:h2:mem:devDb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        driverClassName: org.h2.Driver
        username: root
        password: root
        schema-generate: CREATE_DROP
        dialect: H2

url.shortener:
    prefix: "bozo"